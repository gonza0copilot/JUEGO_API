<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de la Suerte</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contenedor">
        <div class="flecha">▼</div>
        <div class="ruleta" id="ruleta">
            <div class="opcion" style="--i:0; --clr:#f44336;"><span>SHOOTER</span></div>
            <div class="opcion" style="--i:1; --clr:#e91e63;"><span>RPG</span></div>
            <div class="opcion" style="--i:2; --clr:#9c27b0;"><span>ESTRATEGIA</span></div>
            <div class="opcion" style="--i:3; --clr:#673ab7;"><span>AVENTURA</span></div>
        </div>
        <button id="botonGirar">¡Girar!</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
